{% extends 'base.html' %}
{% block title %}Nova Ordem de Serviço | Painel de Gestão{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-sm space-y-6">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Abertura Rápida de Atendimento</h1>
            <p class="text-xs text-slate-500 mt-0.5">Cadastre o cliente e o ativo para gerar o número da ordem de
                serviço.</p>
        </div>

        <form method="POST" action="{{ url_for('nova_os') }}" class="space-y-4">
            <!-- Dados do Cliente -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nome do Cliente *</label>
                    <input type="text" name="cliente_nome" required placeholder="Ex: Carlos Alberto Silva"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Telefone (WhatsApp) *</label>
                    <input type="text" name="cliente_telefone" required placeholder="(00) 00000-0000"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Dados do Ativo / Veículo -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Modelo do Veículo /
                        Equipamento</label>
                    <input type="text" name="veiculo_modelo" placeholder="Ex: Toyota Corolla 2.0"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Placa / Identificador</label>
                    <input type="text" name="veiculo_placa" placeholder="ABC-1234 ou BRA2E19"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono uppercase text-slate-800 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Problema Reclamado -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Relato do Problema / Serviço Solicitado
                    *</label>
                <textarea name="problema" rows="4" required
                    placeholder="Descreva as queixas do cliente ou a revisão solicitada..."
                    class="w-full border border-slate-300 rounded-lg p-3 text-xs text-slate-800 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Botões de Ação -->
            <div class="flex items-center justify-end gap-3 pt-2">
                <a href="{{ url_for('dashboard') }}"
                    class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
                    Cancelar
                </a>
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-5 py-2.5 rounded-lg shadow-sm transition">
                    Gerar Ordem de Serviço
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
